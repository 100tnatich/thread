# Montage de production de Thread (app 01). Voir ~/infra/CONVENTIONS.md.
# AUCUN `ports:` ici: seul le Caddy central du gateway (~/infra/gateway) publie 80/443.
# Réseau partagé à créer une fois:  docker network create web
name: thread

services:
  # Conteneur d'entrée: frontend statique + routage /api. Le seul joint par le gateway.
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      web:
        aliases: [thread-web]   # jamais de nom générique sur le réseau partagé
      interne: {}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /data
      - /config
    user: "10001:10001"
    mem_limit: 128m
    pids_limit: 64

  # Backend FastAPI + moteur de planification: joint UNIQUEMENT par thread-web (réseau interne).
  api:
    build: .
    restart: unless-stopped
    environment:
      FLASHCARDS_ENV: production
      FLASHCARDS_DB: /data/flashcards.db
      FLASHCARDS_UPLOADS: /data/uploads
      FLASHCARDS_DEPOT: /data/depot
      FLASHCARDS_BACKUPS: /data/backups
      # Secrets: définis dans .env, jamais en dur ici.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET manquant}
      ADMIN_USER: ${ADMIN_USER:-nate}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Même clé si elle est écrite en OpenRouter_API_KEY dans .env (le code lit les deux).
      OpenRouter_API_KEY: ${OpenRouter_API_KEY:-}
      # --- Crédit API -------------------------------------------------------
      # Simulé par défaut. La vraie API demande FLASHCARDS_LLM_REEL=1 ET une
      # clé; MOCK_LLM=1 ou LLM_DISABLED=1 coupent tout, quoi qu'il arrive.
      FLASHCARDS_LLM_REEL: ${FLASHCARDS_LLM_REEL:-0}
      # Correction par IA (OpenRouter): réelle seulement avec la clé ET =1.
      FLASHCARDS_JUGE_REEL: ${FLASHCARDS_JUGE_REEL:-0}
      FLASHCARDS_JUGE_MODELE: ${FLASHCARDS_JUGE_MODELE:-}
      MOCK_LLM: ${MOCK_LLM:-0}
      LLM_DISABLED: ${LLM_DISABLED:-0}
      # Plafonds (USD). Vides = valeurs de config.toml (1 / 5 / 0,50).
      FLASHCARDS_COUT_MAX_JOUR: ${FLASHCARDS_COUT_MAX_JOUR:-}
      FLASHCARDS_COUT_MAX_MOIS: ${FLASHCARDS_COUT_MAX_MOIS:-}
      FLASHCARDS_COUT_MAX_OPERATION: ${FLASHCARDS_COUT_MAX_OPERATION:-}
      FLASHCARDS_APPELS_MAX_MINUTE: ${FLASHCARDS_APPELS_MAX_MINUTE:-}
    volumes:
      - donnees:/data
      # Journaux d'usage (tokens/coût), au mieux: le registre SQLite fait foi. Volume pour que
      # le conteneur reste en lecture seule.
      - logs:/app/logs
    # Jamais `ports:` ici: seul le Caddy central est joignable depuis internet.
    expose:
      - "8000"
    networks:
      interne:
        aliases: [thread-api]   # sur `interne` SEULEMENT, jamais sur `web`
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 768m
    pids_limit: 256

networks:
  web:
    external: true
  interne: {}

volumes:
  donnees:
  logs:
